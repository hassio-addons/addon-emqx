---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  workflows:
    uses: hassio-addons/workflows/.github/workflows/addon-ci.yaml@main

  upgrade-test:
    name: EMQX Upgrade Test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build EMQX add-on test image
        run: |
          docker build \
            --platform=linux/amd64 \
            --build-arg BUILD_ARCH=amd64 \
            -t addon-emqx-upgrade-test:local \
            emqx
      - name: Run EMQX upgrade scenarios
        env:
          IMAGE: addon-emqx-upgrade-test:local
          PLATFORM: linux/amd64
        run: bash .github/scripts/emqx-upgrade-test.sh
