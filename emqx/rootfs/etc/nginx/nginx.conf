# Run NGINX in the foreground.
daemon off;

# Workers do not need root: 18083 is unprivileged, and unlike the other apps in
# this family NGINX reads no root owned certificates here.
user www-data;

# Pid storage location.
pid /var/run/nginx.pid;

# Set number of worker processes.
worker_processes 1;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Write error log to the app log.
error_log /proc/1/fd/1 error;

# Loaded by path rather than through /etc/nginx/modules-enabled, which this
# image replaces wholesale. NDK has to come first, set-misc builds on it and
# provides set_escape_uri.
load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_set_misc_module.so;

# Max num of simultaneous connections by a worker process.
events {
    worker_connections 512;
}

http {
    access_log              off;
    client_max_body_size    4G;
    default_type            application/octet-stream;
    keepalive_timeout       65;
    sendfile                on;
    server_tokens           off;
    tcp_nodelay             on;
    tcp_nopush              on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream emqx {
        server 127.0.0.1:18081;
    }

    include /etc/nginx/servers/*.conf;
}
