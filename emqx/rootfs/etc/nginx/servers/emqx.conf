server {
    listen 18083 default_server;

    # A topic level may be empty, so "a//b" has to reach EMQX with both
    # slashes intact rather than collapsed into one.
    merge_slashes off;

    # Home Assistant Ingress decodes percent-encoding in the request path
    # before passing the request on. EMQX takes an MQTT topic as a single
    # encoded path segment, so a topic containing slashes arrives as several
    # segments, matches no route, and comes back as:
    #
    #     {"code":"NOT_FOUND","message":"Request Path Not Found"}
    #
    # These are the routes where the topic is the whole of the trailing path,
    # which is what makes putting the encoding back unambiguous. Requests that
    # already arrive correctly encoded, as they do when the dashboard is opened
    # directly rather than through the sidebar, come out unchanged.
    #
    # https://github.com/hassio-addons/app-emqx/issues/7
    location ~ ^/api/v5/mqtt/topic_metrics/(?<topic>.+)$ {
        set_escape_uri $escaped_topic $topic;
        proxy_pass http://emqx/api/v5/mqtt/topic_metrics/$escaped_topic$is_args$args;
        include /etc/nginx/includes/proxy.conf;
    }

    location ~ ^/api/v5/mqtt/retainer/message/(?<topic>.+)$ {
        set_escape_uri $escaped_topic $topic;
        proxy_pass http://emqx/api/v5/mqtt/retainer/message/$escaped_topic$is_args$args;
        include /etc/nginx/includes/proxy.conf;
    }

    location ~ ^/api/v5/topics/(?<topic>.+)$ {
        set_escape_uri $escaped_topic $topic;
        proxy_pass http://emqx/api/v5/topics/$escaped_topic$is_args$args;
        include /etc/nginx/includes/proxy.conf;
    }

    location / {
        proxy_pass http://emqx;
        include /etc/nginx/includes/proxy.conf;
    }
}
